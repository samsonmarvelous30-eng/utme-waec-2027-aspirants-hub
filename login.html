<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Student Login | UTME & WAEC 2027 Aspirants Hub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #07111f, #13294b, #0b1220);
  color: #fff;
  display: flex;
  flex-direction: column;
}

header {
  padding: 22px 16px;
  text-align: center;
  border-bottom: 1px solid #263751;
}

.logo {
  font-size: 27px;
  margin-bottom: 8px;
}

header h1 {
  font-size: 21px;
  margin: 0;
}

header p {
  color: #b9c8df;
  font-size: 13px;
  margin: 8px 0 0;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px 16px;
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 28px 23px;
  background: #fff;
  color: #172033;
  border-radius: 18px;
  box-shadow: 0 15px 45px rgba(0,0,0,.25);
}

.card h2 {
  margin: 0 0 8px;
  font-size: 25px;
}

.subtitle {
  color: #64748b;
  font-size: 14px;
  margin: 0 0 24px;
  line-height: 1.5;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin: 16px 0 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px #dbeafe;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 17px;
  border: none;
  border-radius: 9px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.secondary {
  background: #eaf0ff;
  color: #1d4ed8;
  margin-top: 10px;
}

#accountMessage {
  padding: 11px;
  margin-top: 16px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  overflow-wrap: anywhere;
}

#accountMessage.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

#accountMessage.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.switch-text {
  margin-top: 22px;
  text-align: center;
  font-size: 14px;
  color: #64748b;
  line-height: 1.6;
}

.switch-text a,
.back-link {
  color: #2563eb;
  font-weight: bold;
  text-decoration: none;
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 18px;
}

footer {
  padding: 18px;
  text-align: center;
  color: #9caec7;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">📚</div>
  <h1>UTME & WAEC 2027 Aspirants Hub</h1>
  <p>Your journey to success starts here.</p>
</header>

<main>
  <section class="card">
    <h2 id="formTitle">Welcome Back!</h2>

    <p class="subtitle" id="formSubtitle">
      Log in to access your practice quizzes and track your progress.
    </p>

    <form id="accountForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        minlength="6"
        required
      >

      <button type="submit" id="submitBtn">Log In</button>
    </form>

    <button type="button" class="secondary" id="switchBtn">
      Create a New Account
    </button>

    <div id="accountMessage" role="status" aria-live="polite"></div>

    <p class="switch-text" id="switchText">
      Don't have an account?
      <a href="#" id="switchLink">Register here</a>
    </p>

    <a class="back-link" href="index.html">
      ← Back to the Practice App
    </a>
  </section>
</main>

<footer>
  © 2026 UTME & WAEC 2027 Aspirants Hub
</footer>



<script type="module">
import {
  getAuth,
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const auth = getAuth();

const form = document.getElementById("accountForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const switchBtn = document.getElementById("switchBtn");
const switchLink = document.getElementById("switchLink");
const switchText = document.getElementById("switchText");
const formTitle = document.getElementById("formTitle");
const formSubtitle = document.getElementById("formSubtitle");
const message = document.getElementById("accountMessage");

let isRegistering = false;
let formBusy = false;

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

function updateFormMode() {
  formTitle.textContent = isRegistering
    ? "Create Your Account"
    : "Welcome Back!";

  formSubtitle.textContent = isRegistering
    ? "Register to access your practice quizzes and save your results."
    : "Log in to access your practice quizzes and track your progress.";

  submitBtn.textContent = isRegistering
    ? "Create Account"
    : "Log In";

  switchBtn.textContent = isRegistering
    ? "I Already Have an Account"
    : "Create a New Account";

  switchText.innerHTML = isRegistering
    ? 'Already registered? <a href="#" id="switchLink">Log in here</a>'
    : 'Don\'t have an account? <a href="#" id="switchLink">Register here</a>';

  document.getElementById("switchLink").addEventListener("click", event => {
    event.preventDefault();
    toggleMode();
  });

  passwordInput.autocomplete = isRegistering
    ? "new-password"
    : "current-password";

  message.className = "";
  message.textContent = "";
  message.style.display = "none";
}

function toggleMode() {
  if (formBusy) return;

  isRegistering = !isRegistering;
  updateFormMode();
}

switchBtn.addEventListener("click", toggleMode);

onAuthStateChanged(auth, user => {
  if (user) {
    window.location.replace("index.html");
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();

  if (formBusy) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showMessage("Please enter your email and password.", "error");
    return;
  }

  formBusy = true;
  submitBtn.disabled = true;
  switchBtn.disabled = true;
  submitBtn.textContent = isRegistering
    ? "Creating Account..."
    : "Logging In...";

  message.style.display = "block";
  showMessage("Please wait...", "success");

  try {
    if (isRegistering) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }

    showMessage("Success! Opening your practice app...", "success");
    window.location.replace("index.html");

  } catch (error) {
    let errorText = "Something went wrong. Please try again.";

    if (
      error.code === "auth/email-already-in-use"
    ) {
      errorText = "This email already has an account. Please log in.";
    } else if (
      error.code === "auth/invalid-email"
    ) {
      errorText = "Please enter a valid email address.";
    } else if (
      error.code === "auth/weak-password"
    ) {
      errorText = "Your password must contain at least 6 characters.";
    } else if (
      error.code === "auth/invalid-credential" ||
      error.code === "auth/wrong-password" ||
      error.code === "auth/user-not-found"
    ) {
      errorText = "Incorrect email or password. Please check your details.";
    } else if (
      error.code === "auth/too-many-requests"
    ) {
      errorText = "Too many attempts. Please wait and try again.";
    } else if (
      error.code === "auth/network-request-failed"
    ) {
      errorText = "Network error. Check your internet connection.";
    }

    message.style.display = "block";
    showMessage(errorText, "error");

  } finally {
    formBusy = false;
    submitBtn.disabled = false;
    switchBtn.disabled = false;

    submitBtn.textContent = isRegistering
      ? "Create Account"
      : "Log In";
  }
});
</script>

</body>
  </html>
